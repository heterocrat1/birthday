
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5c4b5">

    <title>A Little World, Just for You</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <!-- Page CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="landing-page">

        <!-- Background -->
        <div class="background-image"></div>
        <div class="background-overlay"></div>
        <div class="glow"></div>

        <!-- Decorative Elements -->
        <div class="floating-heart heart-one">♡</div>
        <div class="floating-heart heart-two">♥</div>
        <div class="floating-heart heart-three">♡</div>

        <!-- Main Content -->
        <section class="landing-content">

            <p class="eyebrow">
                A LITTLE WORLD, JUST FOR YOU
            </p>

            <div class="title-decoration">
                <span></span>
                <span class="tiny-heart">♡</span>
                <span></span>
            </div>

            <h1>
                Happy Birthday
                <span class="name">Suhana</span>
            </h1>

            <p class="subtitle">
                A little world filled with memories,
                <br class="desktop-break">
                little moments, and things worth remembering.
            </p>

            <div class="small-divider">
                <span>✦</span>
            </div>

            <p class="personal-note">
                Made with care, just for you.
            </p>

            <button class="enter-button" id="enterButton" type="button">
                <span>Enter Our World</span>
                <span class="button-arrow">→</span>
            </button>

            <p class="bottom-note">
                take your time · stay a little
            </p>

        </section>

        <!-- Bottom Decoration -->
        <div class="bottom-glow"></div>

    </main>

    <!-- Page JavaScript -->
    <script src="script.js"></script>

</body>
</html>
